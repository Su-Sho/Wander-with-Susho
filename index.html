<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wander with SuSho</title>
<style>
  :root{
    --bg: #FBF6EC;
    --ink: #22201B;
    --ink-soft: #5A5347;

    --search-bg: #E4EFEC;
    --search-border: #A9CFC4;
    --search-accent: #14594A;

    --filter-bg: #FCEEDD;
    --filter-border: #E7C393;
    --filter-accent: #9C5A1E;

    --card-bg: #FFFFFF;
    --card-border: #E9E1D0;
    --card-accent: #B0472B;

    --add-bg: #EAEEF6;
    --add-border: #C2CBE0;
    --add-accent: #33456B;
  }
  *{box-sizing:border-box;}
  @media (min-width:820px){
    .wrap{max-width:1080px;}
    #results{
      column-count:2;
      column-gap:16px;
    }
    #results .card, #results .letter-heading{
      break-inside:avoid;
    }
  }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: Georgia, 'Iowan Old Style', serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:900px;margin:0 auto;padding:22px 16px 80px;}

  header{padding:6px 4px 20px;margin-bottom:16px;}
  .eyebrow{
    font-family:'Courier New', monospace;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--card-accent);
    margin:0 0 6px;
  }
  h1{font-size:28px;margin:0 0 6px;font-weight:700;color:var(--ink);}
  .sub{font-family:Georgia,serif;font-style:italic;color:var(--ink-soft);font-size:14.5px;margin:0;}

  button{
    font-family:'Courier New',monospace;
    font-size:12px;
    letter-spacing:.04em;
    cursor:pointer;
    border-radius:8px;
    padding:9px 14px;
    border:1px solid transparent;
  }
  .btn-primary{background:var(--add-accent);color:#FFFFFF;border-color:var(--add-accent);font-weight:bold;}
  .btn-ghost{background:#FFFFFF;color:var(--ink-soft);border:1px solid var(--card-border);}
  .btn-danger{background:#FFFFFF;color:#8A3B2B;border:1px solid #E0B7A6;}
  .btn-small{padding:5px 10px;font-size:10.5px;}

  .add-toggle-row{margin-bottom:14px;}

  /* SEARCH ZONE */
  .search-panel{
    background:var(--search-bg);
    border:1px solid var(--search-border);
    border-radius:14px;
    padding:14px;
    margin-bottom:12px;
    position:sticky;
    top:10px;
    z-index:5;
  }
  .search-row{position:relative;display:flex;align-items:center;}
  input[type="text"], input[type="number"]{
    width:100%;
    padding:11px 14px 11px 34px;
    border-radius:9px;
    border:1px solid var(--search-border);
    background:#FFFFFF;
    color:var(--ink);
    font-family:'Courier New',monospace;
    font-size:14px;
  }
  input[type="text"]::placeholder{color:#7C8F82;}
  .search-row::before{
    content:"⌕";
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    color:var(--search-accent);
    font-size:16px;
  }
  .search-clear-btn{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    background:var(--search-accent);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:5px 9px;
    font-size:10.5px;
    display:none;
  }
  .search-clear-btn.show{display:block;}

  .zone-label{
    font-family:'Courier New',monospace;
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    margin:0 0 7px 2px;
    font-weight:bold;
  }
  .search-panel .zone-label{color:var(--search-accent);}
  .filter-panel .zone-label{color:var(--filter-accent);}
  .add-panel .zone-label{color:var(--add-accent);}
  .sub-label{
    font-family:'Courier New',monospace;
    font-size:9.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--filter-accent);
    opacity:.75;
    margin:10px 0 6px 2px;
  }

  /* FILTER ZONE */
  .filter-panel{
    background:var(--filter-bg);
    border:1px solid var(--filter-border);
    border-radius:14px;
    padding:14px;
    margin-bottom:18px;
  }
  .select-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  select{
    width:100%;
    padding:11px 12px;
    border-radius:9px;
    border:1px solid var(--filter-border);
    background:#FFFFFF;
    color:var(--ink);
    font-family:'Courier New',monospace;
    font-size:13px;
    appearance:none;
    -webkit-appearance:none;
    background-image: linear-gradient(45deg, transparent 50%, var(--filter-accent) 50%), linear-gradient(135deg, var(--filter-accent) 50%, transparent 50%);
    background-position: calc(100% - 18px) calc(1em + 2px), calc(100% - 13px) calc(1em + 2px);
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    font-family:'Courier New',monospace;
    font-size:11.5px;
    letter-spacing:.03em;
    padding:6px 11px;
    border-radius:999px;
    border:1px solid var(--filter-border);
    background:#FFFFFF;
    color:var(--filter-accent);
    cursor:pointer;
    user-select:none;
    transition:.15s;
  }
  .chip.active{background:var(--filter-accent);border-color:var(--filter-accent);color:#FFFFFF;font-weight:bold;}
  select.filter-active{background-color:#FCE7C1;border:2px solid var(--filter-accent);font-weight:bold;}
  #search.filter-active{background-color:#FCE7C1;border:2px solid var(--filter-accent);}
  .filter-chip-btn{
    font-family:'Courier New',monospace;
    font-size:11.5px;
    letter-spacing:.03em;
    padding:6px 11px;
    border-radius:999px;
    border:1px solid var(--filter-border);
    background:#FFFFFF;
    color:var(--filter-accent);
    cursor:pointer;
  }
  .diet-tag{
    font-family:'Courier New',monospace;
    font-size:11px;
    font-weight:bold;
    padding:2px 9px;
    border-radius:999px;
    white-space:nowrap;
  }
  .diet-tag.veg{background:#E3F3E3;color:#1E6B1E;border:1px solid #9FCB9F;}
  .diet-tag.nonveg{background:#FBE4E1;color:#A32D2D;border:1px solid #E8B3AC;}
  .halal-tag{
    font-family:'Courier New',monospace;
    font-size:10.5px;
    padding:2px 8px;
    border-radius:999px;
    white-space:nowrap;
    background:#EAF3DE;
    color:#3B6D11;
    border:1px solid #C0DD97;
  }
  .pork-tag{
    font-family:'Courier New',monospace;
    font-size:10.5px;
    padding:2px 8px;
    border-radius:999px;
    white-space:nowrap;
    background:#FAEEDA;
    color:#854F0B;
    border:1px solid #EF9F27;
  }
  .seafood-tag{
    font-family:'Courier New',monospace;
    font-size:10.5px;
    padding:2px 8px;
    border-radius:999px;
    white-space:nowrap;
    background:#DEF0F3;
    color:#0E6B7A;
    border:1px solid #9FD3DC;
  }
  .map-icon-link{
    font-family:'Courier New',monospace;
    font-size:11px;
    font-weight:normal;
    color:var(--search-accent);
    text-decoration:none;
    white-space:nowrap;
    margin-left:4px;
  }
  .map-icon-link:hover{ text-decoration:underline; }
  .branches-box{
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--card-border);
  }
  .branches-label{
    font-family:'Courier New',monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  .branch-row{
    font-size:12.5px;
    color:var(--ink-soft);
    padding:6px 2px;
    border-bottom:1px dashed var(--card-border);
    cursor:pointer;
  }
  .branch-row:last-child{border-bottom:none;}
  .branch-row a{color:var(--search-accent);}
  .branch-expand{
    float:right;
    font-family:'Courier New',monospace;
    font-size:10.5px;
    color:var(--search-accent);
  }
  .branch-row.expanded .branch-expand{text-decoration:underline;}
  .branch-detail{
    padding:4px 4px 8px 10px;
    margin-bottom:4px;
    border-left:2px solid var(--card-border);
  }
  @keyframes flashHighlight{
    0%{ box-shadow:0 0 0 3px var(--search-accent); }
    100%{ box-shadow:0 0 0 0 transparent; }
  }
  .card.flash-highlight{ animation:flashHighlight 1.6s ease-out; }
  .clear-chips-btn{
    font-family:'Courier New',monospace;
    font-size:10px;
    color:var(--filter-accent);
    background:none;
    border:none;
    text-decoration:underline;
    padding:4px 0 0 2px;
    cursor:pointer;
  }

  /* ADD/EDIT ZONE */
  .add-panel{
    background:var(--add-bg);
    border:1px solid var(--add-border);
    border-radius:14px;
    padding:16px;
    margin-bottom:18px;
    display:none;
  }
  .add-panel.open{display:block;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .field{display:flex;flex-direction:column;gap:4px;position:relative;}
  .field.full{grid-column:1 / -1;}
  .suggest-list{
    position:absolute;
    top:100%;
    left:0;
    right:0;
    margin-top:2px;
    background:#FFFFFF;
    border:1px solid var(--add-border);
    border-radius:8px;
    max-height:180px;
    overflow-y:auto;
    z-index:30;
    box-shadow:0 6px 16px rgba(0,0,0,0.12);
    display:none;
  }
  .suggest-list.open{display:block;}
  .suggest-item{
    padding:8px 10px;
    font-family:'Courier New',monospace;
    font-size:12.5px;
    color:var(--ink);
    cursor:pointer;
  }
  .suggest-item:hover, .suggest-item.highlighted{background:var(--add-bg);}
  .field label{
    font-family:'Courier New',monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--add-accent);
  }
  .field input, .field textarea, .field select{
    padding:10px 11px;
    border-radius:8px;
    border:1px solid var(--add-border);
    background:#FFFFFF;
    color:var(--ink);
    font-family:'Courier New',monospace;
    font-size:15px;
    font-weight:700;
    width:100%;
  }
  .field textarea{resize:vertical;min-height:50px;font-family:Georgia,serif;}
  .form-chip{
    font-family:'Courier New',monospace;
    font-size:11px;
    padding:6px 10px;
    border-radius:999px;
    border:1px solid var(--add-border);
    background:#FFFFFF;
    color:var(--add-accent);
    cursor:pointer;
  }
  .form-chip.active{background:var(--add-accent);border-color:var(--add-accent);color:#fff;font-weight:bold;}
  .add-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
  .save-status{font-family:'Courier New',monospace;font-size:11px;color:var(--add-accent);margin-top:8px;min-height:14px;}

  /* LISTING ZONE */
  .count{
    font-family:'Courier New',monospace;
    font-size:11px;
    color:var(--card-accent);
    letter-spacing:.05em;
    margin:2px 0 14px;
    text-transform:uppercase;
  }
  .letter-heading{
    font-family:'Courier New',monospace;
    color:var(--card-accent);
    font-size:12px;
    letter-spacing:.15em;
    border-bottom:1px dashed var(--card-border);
    padding-bottom:5px;
    margin:22px 0 10px;
  }
  .letter-heading:first-of-type{margin-top:0;}
  .card{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-left:4px solid var(--card-accent);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:10px;
  }
  .card-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .name{font-size:17px;font-weight:700;color:var(--ink);}
  .tag-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px;}
  .loc-tag{
    font-family:'Courier New',monospace;
    font-size:11px;
    color:var(--search-accent);
    background:rgba(46,93,77,0.12);
    border:1px solid var(--search-border);
    padding:2px 8px;
    border-radius:999px;
    white-space:nowrap;
  }
  .price-tag{
    font-family:'Courier New',monospace;
    font-size:11px;
    padding:2px 8px;
    border-radius:999px;
    white-space:nowrap;
    border:1px solid var(--add-border);
    color:var(--add-accent);
    background:rgba(46,78,112,0.10);
  }
  .time-tag{
    font-family:'Courier New',monospace;
    font-size:10.5px;
    padding:2px 8px;
    border-radius:999px;
    white-space:nowrap;
    border:1px solid var(--filter-border);
    color:var(--filter-accent);
    background:rgba(95,68,112,0.08);
  }
  .chain-tag{
    font-family:'Courier New',monospace;
    font-size:11px;
    padding:2px 8px;
    border-radius:999px;
    white-space:nowrap;
    border:1px solid var(--card-accent);
    color:var(--card-accent);
    background:transparent;
    cursor:pointer;
  }
  .payment-tag{
    font-family:'Courier New',monospace;
    font-size:11px;
    padding:2px 8px;
    border-radius:999px;
    white-space:nowrap;
    border:1px solid var(--search-border);
    color:var(--search-accent);
    background:rgba(20,89,74,0.08);
  }
  .usp-line{
    font-family: Georgia, serif;
    font-style:italic;
    font-size:13px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .alt-line{
    font-family:'Courier New',monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--card-border);
  }
  .alt-line a{color:var(--card-accent);}
  .hygiene-box{
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--card-border);
  }
  .hygiene-label{
    font-family:'Courier New',monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 5px;
  }
  .hygiene-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px 12px;
  }
  .hygiene-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
  }
  .hygiene-row span:last-child{font-weight:bold;}
  .cat-tag{
    font-family:'Courier New',monospace;
    font-size:10px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--card-accent);
    margin-top:6px;
    display:inline-block;
  }
  .hours-line{
    font-family:'Courier New',monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:5px;
  }
  .note{
    color:var(--ink-soft);
    font-size:13.5px;
    margin-top:6px;
    line-height:1.5;
    font-family: Georgia, serif;
    white-space:pre-wrap;
  }
  .card-actions{display:flex;gap:6px;margin-top:10px;}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-soft);font-family:'Courier New',monospace;font-size:13px;}
  .empty .big{font-size:28px;display:block;margin-bottom:10px;}
  .loading-msg{text-align:center;padding:60px 20px;color:var(--ink-soft);font-family:'Courier New',monospace;font-size:13px;}

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--add-accent);
    color:#fff;
    font-family:'Courier New',monospace;
    font-size:13px;
    padding:10px 18px;
    border-radius:999px;
    box-shadow:0 6px 20px rgba(0,0,0,0.25);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  ::selection{background:var(--filter-accent);color:#fff;}
</style>
<style>
  .auth-bar{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    font-family:'Courier New',monospace;
    font-size:12px;
  }
  .auth-status{color:var(--ink-soft);}
  .login-panel{
    background:var(--add-bg);
    border:1px solid var(--add-border);
    border-radius:14px;
    padding:14px;
    margin-bottom:14px;
    display:none;
  }
  .login-panel.open{display:block;}
  .login-panel input{
    width:100%;
    padding:9px 10px;
    border-radius:8px;
    border:1px solid var(--add-border);
    background:#FFFFFF;
    color:var(--ink);
    font-family:'Courier New',monospace;
    font-size:13px;
    margin-bottom:8px;
  }
  .sync-badge{
    font-family:'Courier New',monospace;
    font-size:10.5px;
    color:var(--search-accent);
  }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Suhail Shoukath's</p>
    <h1>Wander with SuSho</h1>
    <p class="sub">Eat, Explore, Experience.</p>
  </header>

  <div class="auth-bar">
    <span class="auth-status" id="authStatus">Checking…</span>
    <button class="btn-ghost btn-small" id="loginToggleBtn">Admin Login</button>
    <button class="btn-ghost btn-small" id="logoutBtn" style="display:none;">Log Out</button>
  </div>

  <div class="login-panel" id="loginPanel">
    <p class="zone-label" style="color:var(--add-accent);">Admin Login</p>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <div class="add-actions">
      <button class="btn-ghost" id="loginCancelBtn">Cancel</button>
      <button class="btn-primary" id="loginSubmitBtn">Log In</button>
    </div>
    <div class="save-status" id="loginStatus"></div>
  </div>

  <div class="add-toggle-row" id="adminControls" style="display:none;">
    <button class="btn-primary" id="toggleAddBtn">+ Add a Place</button>
    <button class="btn-ghost" id="importSeedBtn" style="margin-left:8px;">Import Starter Data (run once)</button>
  </div>

  <div class="add-panel" id="addPanel">
    <p class="zone-label" id="addPanelTitle">Add a New Place</p>
    <div class="field-grid">
      <div class="field">
        <label>State <span style="opacity:.6;">*</span></label>
        <select id="f_state"></select>
        <input type="text" id="f_state_new" class="new-value-input" placeholder="Enter new state name" style="display:none;margin-top:6px;">
      </div>
      <div class="field">
        <label>District <span style="opacity:.6;">*</span></label>
        <select id="f_district"></select>
        <input type="text" id="f_district_new" class="new-value-input" placeholder="Enter new district name" style="display:none;margin-top:6px;">
      </div>
      <div class="field">
        <label>Area / Locality <span style="opacity:.6;">*</span></label>
        <select id="f_area"></select>
        <input type="text" id="f_area_new" class="new-value-input" placeholder="Enter new area name" style="display:none;margin-top:6px;">
      </div>
      <div class="field">
        <label>Exact Location (within Area)</label>
        <select id="f_location"></select>
        <input type="text" id="f_location_new" class="new-value-input" placeholder="Enter new location name" style="display:none;margin-top:6px;">
      </div>
      <div class="field">
        <label>Category</label>
        <select id="f_category"></select>
        <input type="text" id="f_category_new" class="new-value-input" placeholder="Enter new category" style="display:none;margin-top:6px;">
        <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-weight:normal;">
          <input type="checkbox" id="f_seafood" style="width:auto;"> Seafood (tag, filterable under Food)
        </label>
      </div>
      <div class="field">
        <label>Price Level</label>
        <select id="f_price">
          <option value="">— Select —</option>
          <option value="Budget">Budget</option>
          <option value="Premium">Premium</option>
        </select>
      </div>
      <div class="field">
        <label>Hours (as written, e.g. split shifts)</label>
        <input type="text" id="f_hours" placeholder="e.g. 7 AM–12 PM, 4 PM–7 PM">
      </div>
      <div class="field">
        <label>Distance from Area (km)</label>
        <input type="number" id="f_distance" step="0.1" min="0" placeholder="e.g. 1.5">
      </div>
      <div class="field full">
        <label>Google Maps Link</label>
        <input type="text" id="f_maplink" placeholder="Paste the share link from Google Maps">
      </div>
      <div class="field">
        <label>Chain / Brand Name (for branches)</label>
        <input type="text" id="f_chain" placeholder="e.g. Milano Ice Cream — leave blank if not a chain">
      </div>
      <div class="field">
        <label>Payment Accepted</label>
        <select id="f_payment">
          <option value="">— Select —</option>
          <option value="Cash Only">Cash Only</option>
          <option value="Cash & Online">Cash & Online</option>
          <option value="Online Only">Online Only</option>
        </select>
      </div>
      <div class="field">
        <label>Diet Type</label>
        <select id="f_diet">
          <option value="">— Select —</option>
          <option value="Veg">Veg</option>
          <option value="Non-Veg">Non-Veg</option>
        </select>
      </div>
      <div class="field" id="f_halal_wrap" style="display:none;">

function uniqueSorted(arr){ return Array.from(new Set(arr.filter(v=>v!==undefined && v!==null && v!==""))).sort(); }
// "Seafood" used to be its own category. It now lives under "Food" as a tag instead.
// This keeps old entries working without needing to manually edit every existing record.
function effectiveCategory(p){ return p.category === "Seafood" ? "Food" : (p.category || ""); }
function isSeafood(p){ return p.category === "Seafood" || (Array.isArray(p.tags) && p.tags.includes("Seafood")); }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }

function distanceBucket(km){
  if(km === null || km === undefined || km === "") return null;
  const n = parseFloat(km);
  if(isNaN(n)) return null;
  if(n <= 0.5) return "500m";
  if(n <= 1) return "1km";
  if(n <= 2) return "1-2km";
  if(n <= 5) return "2-5km";
  if(n <= 10) return "5-10km";
  return "10km+";
}

function formatHour(h){
  const hh = ((h % 24) + 24) % 24;
  const ampm = hh < 12 ? 'AM' : 'PM';
  let hour12 = hh % 12;
  if(hour12 === 0) hour12 = 12;
  return `${hour12} ${ampm}`;
}

function mergedTimingLabels(timings){
  if(!timings || timings.length === 0) return [];
  if(timings.includes("24 Hours")) return ["Open 24 Hours"];
  const ranges = timings
    .filter(t => TIMING_RANGES[t])
    .map(t => ({start: TIMING_RANGES[t][0], end: TIMING_RANGES[t][1]}))
    .sort((a,b)=>a.start-b.start);
  const merged = [];
  ranges.forEach(r=>{
    const last = merged[merged.length-1];
    if(last && r.start <= last.end){ last.end = Math.max(last.end, r.end); }
    else { merged.push({start:r.start, end:r.end}); }
  });
  return merged.map(m => `${formatHour(m.start)} – ${formatHour(m.end)}`);
}


// Parses a single time token like "7 AM", "11:30 PM", "12 AM" into hours-since-midnight (0-24).
function parseTimeToken(token){
  const m = token.trim().match(/^(\d{1,2})(?::(\d{2}))?\s*([AaPp][Mm])$/);
  if(!m) return null;
  let h = parseInt(m[1], 10);
  const min = m[2] ? parseInt(m[2], 10) : 0;
  const ap = m[3].toUpperCase();
  if(ap === 'AM'){ if(h === 12) h = 0; } else { if(h !== 12) h += 12; }
  return h + min / 60;
}
// Parses free-text hours (e.g. "7 AM–11 PM, 4 PM-7 PM") into [{start,end}, ...] ranges,
// extending past 24 for entries that cross midnight, to match the TIMING_RANGES scale.
function parseHoursRanges(hoursText){
  if(!hoursText) return [];
  if(/24\s*(hours|hrs|hr)/i.test(hoursText)) return [{start: 0, end: 28}];
  const parts = hoursText.split(/,|;/).map(s => s.trim()).filter(Boolean);
  const ranges = [];
  parts.forEach(part => {
    const seg = part.split(/–|—|-|to/i).map(s => s.trim()).filter(Boolean);
    if(seg.length !== 2) return;
    const start = parseTimeToken(seg[0]);
    let end = parseTimeToken(seg[1]);
    if(start === null || end === null) return;
    if(end <= start) end += 24; // crosses midnight
    ranges.push({start, end});
  });
  return ranges;
}
function rangesOverlap(a, b){ return a.start < b.end && b.start < a.end; }
// Checks whether a place's free-text hours overlap a given TIMING_BUCKETS key's hour range,
// so custom hours (not matching any fixed tag) still surface in timing-tag filtering.
function hoursMatchesTimingKey(hoursText, key){
  if(key === "24 Hours"){
    return /24\s*(hours|hrs|hr)/i.test(hoursText || "");
  }
  const bucket = TIMING_RANGES[key];
  if(!bucket) return false;
  const br = {start: bucket[0], end: bucket[1]};
  const parsed = parseHoursRanges(hoursText);
  return parsed.some(r =>
    rangesOverlap(r, br) ||
    rangesOverlap({start: r.start + 24, end: r.end + 24}, br) ||
    rangesOverlap({start: r.start - 24, end: r.end - 24}, br)
  );
}

const NEW_OPTION = "__new__";

function buildSelectOptions(selectEl, options, keepValue){
  const prevValue = keepValue !== undefined ? keepValue : selectEl.value;
  selectEl.innerHTML = "";
  const blank = document.createElement('option');
  blank.value = ""; blank.textContent = "— Select —";
  selectEl.appendChild(blank);
  options.forEach(o=>{
    const op = document.createElement('option');
    op.value = o; op.textContent = o;
    selectEl.appendChild(op);
  });
  const addNew = document.createElement('option');
  addNew.value = NEW_OPTION; addNew.textContent = "+ Add New…";
  selectEl.appendChild(addNew);
  if(prevValue && (options.includes(prevValue) || prevValue === NEW_OPTION)){
    selectEl.value = prevValue;
  } else {
    selectEl.value = "";
  }
}

function getSelectValue(selectEl, newInputEl){
  return selectEl.value === NEW_OPTION ? newInputEl.value.trim() : selectEl.value;
}

function toggleNewInput(selectEl, newInputEl){
  const show = selectEl.value === NEW_OPTION;
  newInputEl.style.display = show ? "block" : "none";
}

function refreshFormStateOptions(){
  buildSelectOptions(els.f_state, uniqueSorted(PLACES.map(p=>p.state)));
  toggleNewInput(els.f_state, els.f_state_new);
}

  states.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s; els.stateFilter.appendChild(o); });

  populateDistrictOptions();

function render(){
  const q = els.search.value.trim().toLowerCase();
  els.searchClearBtn.classList.toggle('show', q.length > 0);
  els.search.classList.toggle('filter-active', q.length > 0);

  const st = els.stateFilter.value;
  const di = els.districtFilter.value;
  const ar = els.areaFilter.value;
  const loc = els.locationFilter.value;
  const distSel = els.distanceFilter.value;
  els.stateFilter.classList.toggle('filter-active', st !== "All States");
  els.districtFilter.classList.toggle('filter-active', di !== "All Districts");
  els.areaFilter.classList.toggle('filter-active', ar !== "All Areas");
  els.locationFilter.classList.toggle('filter-active', loc !== "All Locations");
  els.distanceFilter.classList.toggle('filter-active', distSel !== "All");

  let filtered = PLACES.filter(p=>{
    const matchesState = st === "All States" ? true : p.state === st;
    const matchesDistrict = di === "All Districts" ? true : p.district === di;
    const matchesArea = ar === "All Areas" ? true : p.area === ar;
    const matchesLocation = loc === "All Locations" ? true : p.location === loc;
    const matchesCat = activeCategory === "All" ? true : effectiveCategory(p) === activeCategory;
    const matchesPrice = activePrice === "All" ? true : p.price === activePrice;
    const matchesDiet = activeDiet === "All" ? true : p.diet === activeDiet;
    const matchesHalal = activeHalal === "All" ? true : p.halal === "Yes";
    const matchesPork = porkOnly ? p.pork === "Yes" : true;
    const matchesSeafood = seafoodOnly ? isSeafood(p) : true;
    const matchesTiming = activeTimings.size === 0 ? true : (
      (p.timings || []).some(t => activeTimings.has(t)) ||
      Array.from(activeTimings).some(t => hoursMatchesTimingKey(p.hours, t))
    );
    const matchesDistance = distSel === "All" ? true : distanceBucket(p.distance_km) === distSel;
    const hay = (p.name+" "+p.state+" "+p.district+" "+p.area+" "+(p.location||"")+" "+effectiveCategory(p)+" "+(p.chain||"")+" "+(p.usp||"")+" "+((p.tags||[]).join(" "))+" "+p.note).toLowerCase();
    const matchesQ = q === "" ? true : hay.includes(q);
    return matchesState && matchesDistrict && matchesArea && matchesLocation && matchesCat && matchesPrice && matchesDiet && matchesHalal && matchesPork && matchesSeafood && matchesTiming && matchesDistance && matchesQ;
  });

  // Group entries that share a Chain name so branches list under one card.
  const chainGroups = {};
  const cards = [];
  filtered.forEach(p=>{
    if(p.chain && p.chain.trim()){
      const key = p.chain.trim().toLowerCase();
      if(!chainGroups[key]) chainGroups[key] = [];
      chainGroups[key].push(p);
    } else {
      cards.push({ main: p, branches: [] });
    }
  });
  Object.values(chainGroups).forEach(group=>{
    group.sort((a,b)=>(a.area||'').localeCompare(b.area||''));
    cards.push({ main: group[0], branches: group.slice(1) });
  });

  cards.sort((a,b)=> (a.main.name||'').localeCompare(b.main.name||''));

  els.count.textContent = filtered.length + (filtered.length===1?' spot found':' spots found');
  els.results.innerHTML = "";

  if(cards.length === 0){
    els.results.innerHTML = '<div class="empty"><span class="big">☕</span>Nothing here. Try a different filter or search term.</div>';
    return;
  }

  let currentLetter = null;
  cards.forEach(item=>{
    const p = item.main;
    const letter = (p.name && p.name[0]) ? p.name[0].toUpperCase() : '#';
    if(letter !== currentLetter){
      currentLetter = letter;
      const h = document.createElement('div'); h.className='letter-heading'; h.textContent=currentLetter;
      els.results.appendChild(h);
    }
    els.results.appendChild(buildCard(p, item.branches));
  });
}

function findClosestAlternative(p){
  // No GPS coordinates are stored, so this is an approximation restricted to the SAME Area only —
  // a district-wide fallback was removed because it could suggest places many km away.
  // Exclude anything that's actually the same restaurant (same name, or same chain/branch group) —
  // those belong under "Branches", not "Alternative nearby". Diet must match exactly (Veg/Non-Veg/blank),
  // so a Veg place never gets suggested a Non-Veg "alternative".
  const pName = (p.name || '').trim().toLowerCase();
  const pChain = (p.chain || '').trim().toLowerCase();
  const pool = PLACES.filter(x=>{
    if(x.id === p.id) return false;
    if(x.area !== p.area) return false;
    if(effectiveCategory(x) !== effectiveCategory(p)) return false;
    if((x.diet || '') !== (p.diet || '')) return false;
    const xName = (x.name || '').trim().toLowerCase();
    if(pName && xName === pName) return false;
    const xChain = (x.chain || '').trim().toLowerCase();
    if(pChain && xChain && xChain === pChain) return false;
    return true;
  });
  const alt = pool[0];
  return alt ? { place: alt, km: null } : null;
}

// Jumps the view to a specific place: clears filters that could hide it, re-renders,
// then scrolls to and briefly highlights its card (used by "Alternative nearby" links).
function jumpToPlace(id){
  els.search.value = "";
  els.stateFilter.value = "All States"; populateDistrictOptions();
  els.districtFilter.value = "All Districts"; populateAreaOptions();
  els.areaFilter.value = "All Areas"; populateLocationOptions();
  els.locationFilter.value = "All Locations";
  els.distanceFilter.value = "All";
  activeCategory = "All"; activePrice = "All"; activeDiet = "All"; activeHalal = "All";
  porkOnly = false; seafoodOnly = false; activeTimings = new Set();
  populateCategoryChips(); populatePriceChips(); populateDietChips(); populateTimingFilterChips();
  render();
  requestAnimationFrame(()=>{
    const card = Array.from(els.results.children).find(el=>{
      if(!el.dataset) return false;
      if(el.dataset.mainId === id) return true;
      if(el.dataset.branchIds && el.dataset.branchIds.split(',').includes(id)) return true;
      return false;
    });
    if(card){
      card.scrollIntoView({behavior:'smooth', block:'center'});
      card.classList.add('flash-highlight');
      setTimeout(()=>card.classList.remove('flash-highlight'), 1600);
    }
  });
}

function buildCard(p, branches){
  branches = branches || [];
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.mainId = p.id;
  card.dataset.branchIds = branches.map(b=>b.id).join(',');
  const exactLoc = p.location ? escapeHtml(p.location) : '';

  let distanceLine = '';
  if(p.distance_km !== null && p.distance_km !== undefined && p.distance_km !== ""){
    distanceLine = `<span class="loc-tag">${p.distance_km} km from ${escapeHtml(p.area)}</span>`;
  }
  // Custom "Hours as written" ALWAYS takes priority over the fixed timing-bucket tags —
  // if hours text is filled in, that's the only time indicator shown (via the clock-icon line below),
  // so the card never shows two conflicting time ranges at once.
  const timingTags = (p.hours && p.hours.trim())
    ? ''
    : mergedTimingLabels(p.timings).map(label=>`<span class="time-tag">${escapeHtml(label)}</span>`).join('');
  const priceTag = p.price ? `<span class="price-tag">${escapeHtml(p.price)}</span>` : '';
  const paymentTag = p.payment ? `<span class="payment-tag">${escapeHtml(p.payment)}</span>` : '';
  const hoursLine = p.hours ? `<div class="hours-line">⏱ ${escapeHtml(p.hours)}</div>` : '';
  const locationLine = exactLoc ? `<div class="hours-line">📍 ${exactLoc}</div>` : '';
  const instagramIconSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>`;
  const instagramLine = p.instagram ? `<div class="hours-line">${instagramIconSvg} <a href="${escapeAttr(p.instagram)}" target="_blank" rel="noopener noreferrer" style="color:var(--search-accent);">View on Instagram</a></div>` : '';
  const uspLine = p.usp ? `<div class="usp-line"><strong>Must Try:</strong> ${escapeHtml(p.usp)}</div>` : '';
  const mapIcon = p.maplink ? ` <a href="${escapeAttr(p.maplink)}" target="_blank" rel="noopener noreferrer" class="map-icon-link" title="Open in Google Maps">📍 Open in Google Maps</a>` : '';

  let dietTag = '';
  if(p.diet === 'Veg') dietTag = `<span class="diet-tag veg">VEG</span>`;
  else if(p.diet === 'Non-Veg') dietTag = `<span class="diet-tag nonveg">NON-VEG</span>`;
  const halalTag = p.halal === 'Yes' ? `<span class="halal-tag">Halal</span>` : '';
  const porkTag = p.pork === 'Yes' ? `<span class="pork-tag">Serves Pork</span>` : '';
  const seafoodTag = isSeafood(p) ? `<span class="seafood-tag">Seafood</span>` : '';

  let chainTag = '';
  const totalBranches = branches.length + 1;
  if(p.chain && totalBranches > 1){
    chainTag = `<span class="chain-tag" data-chain="${escapeAttr(p.chain)}">${escapeHtml(p.chain)} · ${totalBranches} branches</span>`;
  }

  let hygieneBox = '';
  const hy = p.hygiene || {};
  const hyEntries = [
    ['Kitchen', hy.kitchen], ['Tables', hy.tables], ['Glasses', hy.glass],
    ['Floor', hy.floor], ['Toilet', hy.toilet], ['Staff', hy.staff], ['Service', hy.service],
  ].filter(([,v])=> v !== null && v !== undefined && v !== "");
  if(hyEntries.length){
    hygieneBox = `<div class="hygiene-box"><p class="hygiene-label">Hygiene</p><div class="hygiene-grid">${
      hyEntries.map(([label,val])=>`<div class="hygiene-row"><span>${label}</span><span>${val}</span></div>`).join('')
    }</div></div>`;
  }

  let altLine = '';
  const SHOW_ALTERNATIVE_NEARBY = false; // set to true to bring back the "Alternative nearby" line
  if(SHOW_ALTERNATIVE_NEARBY){
    const altResult = findClosestAlternative(p);
    if(altResult){
      const alt = altResult.place;
      altLine = `<div class="alt-line">Alternative nearby: <a href="#" data-alt-id="${escapeAttr(alt.id)}">${escapeHtml(alt.name || '(unnamed)')} (${escapeHtml(alt.area)})</a></div>`;
    }
  }

  let branchesBox = '';
  if(branches.length){
    const rows = branches.map((b, idx)=>{
      const detailId = `bdetail-${p.id}-${idx}`;
      const bLoc = b.location ? `, ${escapeHtml(b.location)}` : '';
      const bHoursShort = (b.hours && b.hours.trim()) ? b.hours : (mergedTimingLabels(b.timings)[0] || '');
      const bUsp = b.usp ? `<div class="usp-line"><strong>Must Try:</strong> ${escapeHtml(b.usp)}</div>` : '';
      const bMapLine = b.maplink ? `<div class="hours-line">📍 <a href="${escapeAttr(b.maplink)}" target="_blank" rel="noopener noreferrer" style="color:var(--search-accent);">Open in Google Maps</a></div>` : '';
      const bHoursLine = b.hours ? `<div class="hours-line">⏱ ${escapeHtml(b.hours)}</div>` : '';
      const bHy = b.hygiene || {};
      const bHyEntries = [
        ['Kitchen', bHy.kitchen], ['Tables', bHy.tables], ['Glasses', bHy.glass],
        ['Floor', bHy.floor], ['Toilet', bHy.toilet], ['Staff', bHy.staff], ['Service', bHy.service],
      ].filter(([,v])=> v !== null && v !== undefined && v !== "");
      const bHygieneBox = bHyEntries.length ? `<div class="hygiene-box"><p class="hygiene-label">Hygiene</p><div class="hygiene-grid">${
        bHyEntries.map(([label,val])=>`<div class="hygiene-row"><span>${label}</span><span>${val}</span></div>`).join('')
      }</div></div>` : '';
      const bNote = b.note ? `<div class="note">${escapeHtml(b.note)}</div>` : '';
      return `
        <div class="branch-row" data-toggle="${detailId}">${escapeHtml(b.area)}${bLoc}${bHoursShort ? ` — ${escapeHtml(bHoursShort)}` : ''} <span class="branch-expand">Details ▾</span></div>
        <div class="branch-detail" id="${detailId}" style="display:none;">${bUsp}${bHoursLine}${bMapLine}${bNote}${bHygieneBox}</div>`;
    }).join('');
    branchesBox = `<div class="branches-box"><p class="branches-label">${branches.length} more branch${branches.length===1?'':'es'}</p>${rows}</div>`;
  }

  const adminButtons = isAdmin ? `
    <div class="card-actions">
      <button class="btn-ghost btn-small" data-action="edit" data-id="${p.id}">Edit</button>
      <button class="btn-ghost btn-small" data-action="duplicate" data-id="${p.id}">Duplicate</button>
      <button class="btn-danger btn-small" data-action="delete" data-id="${p.id}">Delete</button>
    </div>` : '';

  card.innerHTML = `
    <div class="card-top">
      <span class="name">${p.name ? escapeHtml(p.name) : '(Unnamed spot)'}${mapIcon}</span>
      <div class="tag-row">
        <span class="loc-tag">${escapeHtml(p.area)}</span>
        <span class="loc-tag">${escapeHtml(p.district)}, ${escapeHtml(p.state)}</span>
        ${priceTag}
        ${dietTag}
      </div>
    </div>
    <div class="tag-row">${distanceLine}${timingTags}${paymentTag}${halalTag}${porkTag}${seafoodTag}${chainTag}</div>
    <span class="cat-tag">${escapeHtml(effectiveCategory(p))}</span>
    ${uspLine}
    ${locationLine}
    ${hoursLine}
    ${instagramLine}
    <div class="note">${escapeHtml(p.note)}</div>
    ${hygieneBox}
    ${altLine}
    ${branchesBox}
    ${adminButtons}
  `;
  const chainEl = card.querySelector('[data-chain]');
  if(chainEl){
    chainEl.addEventListener('click', ()=>{ els.search.value = chainEl.dataset.chain; render(); window.scrollTo({top:0, behavior:'smooth'}); });
  }
  const altEl = card.querySelector('[data-alt-id]');
  if(altEl){
    altEl.addEventListener('click', (e)=>{ e.preventDefault(); jumpToPlace(altEl.dataset.altId); });
  }
  card.querySelectorAll('[data-toggle]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const detail = card.querySelector('#' + CSS.escape(row.dataset.toggle));
      if(!detail) return;
      const show = detail.style.display === 'none';
      detail.style.display = show ? 'block' : 'none';
      row.classList.toggle('expanded', show);
    });
  });
  if(isAdmin){
    card.querySelector('[data-action="edit"]').addEventListener('click', ()=>openEdit(p.id));
    card.querySelector('[data-action="duplicate"]').addEventListener('click', ()=>duplicatePlace(p.id));
    card.querySelector('[data-action="delete"]').addEventListener('click', ()=>deletePlace(p.id));
  }
  return card;
}

// ---------- Admin form ----------
function openAddForm(){
  editingId = null;
  els.addPanelTitle.textContent = "Add a New Place";
  els.saveAddBtn.textContent = "Save Place";
  clearForm();
  els.addPanel.classList.add('open');
  els.saveStatus.textContent = "";
}
function openEdit(id){
  const p = PLACES.find(x=>x.id===id);
  if(!p) return;
  editingId = id;
  els.addPanelTitle.textContent = "Edit Place";
  els.saveAddBtn.textContent = "Update Place";

  refreshFormStateOptions(); els.f_state.value = p.state || ""; toggleNewInput(els.f_state, els.f_state_new);
  refreshFormDistrictOptions(); els.f_district.value = p.district || ""; toggleNewInput(els.f_district, els.f_district_new);
  refreshFormAreaOptions(); els.f_area.value = p.area || ""; toggleNewInput(els.f_area, els.f_area_new);
  refreshFormLocationOptions(); els.f_location.value = p.location || ""; toggleNewInput(els.f_location, els.f_location_new);
  refreshFormCategoryOptions(); els.f_category.value = effectiveCategory(p); toggleNewInput(els.f_category, els.f_category_new);
  els.f_seafood.checked = isSeafood(p);

  els.f_price.value = p.price || "";
  els.f_hours.value = p.hours || "";
  els.f_distance.value = (p.distance_km === null || p.distance_km === undefined) ? "" : p.distance_km;
  els.f_maplink.value = p.maplink || "";
  els.f_chain.value = p.chain || "";
  els.f_payment.value = p.payment || "";
  els.f_diet.value = p.diet || "";
  els.f_halal.value = p.halal || "";
  els.f_pork.value = p.pork || "";
  syncDietFieldsVisibility();
  els.f_usp.value = p.usp || "";
  els.f_name.value = p.name || "";
  els.f_instagram.value = p.instagram || "";
  els.f_note.value = p.note || "";
  const hy = p.hygiene || {};
  els.h_kitchen.value = hy.kitchen ?? "";
  els.h_tables.value = hy.tables ?? "";
  els.h_glass.value = hy.glass ?? "";
  els.h_floor.value = hy.floor ?? "";
  els.h_toilet.value = hy.toilet ?? "";
  els.h_staff.value = hy.staff ?? "";
  els.h_service.value = hy.service ?? "";
  formTimings = new Set(p.timings || []);
  syncFormTimingChipsUI();
  els.addPanel.classList.add('open');
  els.saveStatus.textContent = "";
  els.addPanel.scrollIntoView({behavior:'smooth', block:'start'});
}
function duplicatePlace(id){
  const p = PLACES.find(x=>x.id===id);
  if(!p) return;
  editingId = null; // duplicating always creates a brand-new entry
  els.addPanelTitle.textContent = "Add Branch (from " + (p.name || "duplicate") + ")";
  els.saveAddBtn.textContent = "Save as New Place";

  refreshFormStateOptions(); els.f_state.value = p.state || ""; toggleNewInput(els.f_state, els.f_state_new);
  refreshFormDistrictOptions(); els.f_district.value = p.district || ""; toggleNewInput(els.f_district, els.f_district_new);
  refreshFormAreaOptions(); els.f_area.value = ""; toggleNewInput(els.f_area, els.f_area_new); // fill in the new branch's area
  refreshFormLocationOptions(); els.f_location.value = ""; toggleNewInput(els.f_location, els.f_location_new);
  refreshFormCategoryOptions(); els.f_category.value = effectiveCategory(p); toggleNewInput(els.f_category, els.f_category_new);
  els.f_seafood.checked = isSeafood(p);

  els.f_price.value = p.price || "";
  els.f_hours.value = p.hours || "";
  els.f_distance.value = "";
  els.f_maplink.value = "";
  // Auto-fill Chain with the restaurant's name (if not already a chain) so both entries group as branches.
  els.f_chain.value = (p.chain && p.chain.trim()) ? p.chain : (p.name || "");
  els.f_payment.value = p.payment || "";
  els.f_diet.value = p.diet || "";
  els.f_halal.value = p.halal || "";
  els.f_pork.value = p.pork || "";
  syncDietFieldsVisibility();
  els.f_usp.value = p.usp || "";
  els.f_name.value = p.name || "";
  els.f_instagram.value = "";
  els.f_note.value = p.note || "";
  const hy = p.hygiene || {};
  els.h_kitchen.value = hy.kitchen ?? "";
  els.h_tables.value = hy.tables ?? "";
  els.h_glass.value = hy.glass ?? "";
  els.h_floor.value = hy.floor ?? "";
  els.h_toilet.value = hy.toilet ?? "";
  els.h_staff.value = hy.staff ?? "";
  els.h_service.value = hy.service ?? "";
  formTimings = new Set(p.timings || []);
  syncFormTimingChipsUI();
  els.addPanel.classList.add('open');
  els.saveStatus.textContent = "Duplicated — set the new Area/Location, then Save.";
  els.addPanel.scrollIntoView({behavior:'smooth', block:'start'});
}
function clearForm(){
  refreshFormStateOptions(); els.f_state.value=""; els.f_state_new.value=""; toggleNewInput(els.f_state, els.f_state_new);
  refreshFormDistrictOptions(); els.f_district.value=""; els.f_district_new.value=""; toggleNewInput(els.f_district, els.f_district_new);
  refreshFormAreaOptions(); els.f_area.value=""; els.f_area_new.value=""; toggleNewInput(els.f_area, els.f_area_new);
  refreshFormLocationOptions(); els.f_location.value=""; els.f_location_new.value=""; toggleNewInput(els.f_location, els.f_location_new);
  refreshFormCategoryOptions(); els.f_category.value=""; els.f_category_new.value=""; toggleNewInput(els.f_category, els.f_category_new);
  els.f_seafood.checked = false;
  els.f_price.value=""; els.f_hours.value=""; els.f_distance.value="";
  els.f_maplink.value="";
  els.f_chain.value=""; els.f_payment.value=""; els.f_usp.value="";
  els.f_diet.value=""; els.f_halal.value=""; els.f_pork.value="";
  syncDietFieldsVisibility();
  els.f_name.value=""; els.f_instagram.value=""; els.f_note.value="";
  els.h_kitchen.value=""; els.h_tables.value=""; els.h_glass.value=""; els.h_floor.value="";
  els.h_toilet.value=""; els.h_staff.value=""; els.h_service.value="";
  formTimings = new Set();
  syncFormTimingChipsUI();
}
function closeAddForm(){
  els.addPanel.classList.remove('open');
  editingId = null;
  clearForm();
}
function showToast(msg){
  els.toast.textContent = msg;
  els.toast.classList.add('show');
  setTimeout(()=>{ els.toast.classList.remove('show'); }, 1800);
}

async function saveForm(){
  const hygiene = {
    kitchen: els.h_kitchen.value === "" ? null : parseFloat(els.h_kitchen.value),
    tables: els.h_tables.value === "" ? null : parseFloat(els.h_tables.value),
    glass: els.h_glass.value === "" ? null : parseFloat(els.h_glass.value),
    floor: els.h_floor.value === "" ? null : parseFloat(els.h_floor.value),
    toilet: els.h_toilet.value === "" ? null : parseFloat(els.h_toilet.value),
    staff: els.h_staff.value === "" ? null : parseFloat(els.h_staff.value),
    service: els.h_service.value === "" ? null : parseFloat(els.h_service.value),
  };
  const entry = {
    state: getSelectValue(els.f_state, els.f_state_new),
    district: getSelectValue(els.f_district, els.f_district_new),
    area: getSelectValue(els.f_area, els.f_area_new),
    location: getSelectValue(els.f_location, els.f_location_new),
    category: getSelectValue(els.f_category, els.f_category_new) || "Uncategorized",
    tags: els.f_seafood.checked ? ["Seafood"] : [],
    price: els.f_price.value,
    hours: els.f_hours.value.trim(),
    distance_km: els.f_distance.value === "" ? null : parseFloat(els.f_distance.value),
    maplink: els.f_maplink.value.trim(),
    chain: els.f_chain.value.trim(),
    payment: els.f_payment.value,
    diet: els.f_diet.value,
    halal: els.f_diet.value === "Non-Veg" ? els.f_halal.value : "",
    pork: els.f_diet.value === "Non-Veg" ? els.f_pork.value : "",
    usp: els.f_usp.value.trim(),
    name: els.f_name.value.trim(),
    instagram: els.f_instagram.value.trim(),
    timings: Array.from(formTimings),
    hygiene: hygiene,
    note: els.f_note.value.trim(),
  };
  if(!entry.state || !entry.district || !entry.area){
    els.saveStatus.textContent = "Please fill in State, District, and Area.";
    return;
  }
  els.saveStatus.textContent = "Saving…";
  try{
    if(editingId){
      await placesCol.doc(editingId).update(entry);
      showToast("Entry Updated");
    } else {
      await placesCol.add(entry);
      showToast("Entry Added");
    }
    closeAddForm();
  } catch(err){
    els.saveStatus.textContent = "Save failed: " + err.message;
  }
}

async function deletePlace(id){
  const p = PLACES.find(x=>x.id===id);
  if(!p) return;
  if(!confirm(`Delete "${p.name || 'this place'}"? This can't be undone.`)) return;
  try{
    await placesCol.doc(id).delete();
    showToast("Entry Deleted");
  } catch(err){
    alert("Delete failed: " + err.message);
  }
}

async function importSeedData(){
  if(!confirm(`This will add ${SEED_DATA.length} starter places to your live database. Only run this once. Continue?`)) return;
  els.importSeedBtn.disabled = true;
  els.importSeedBtn.textContent = "Importing…";
  try{
    const batchSize = 20;
    for(let i=0; i<SEED_DATA.length; i+=batchSize){
      const batch = db.batch();
      SEED_DATA.slice(i, i+batchSize).forEach(entry=>{
        const ref = placesCol.doc();
        batch.set(ref, entry);
      });
      await batch.commit();
    }
    showToast("Starter data imported");
  } catch(err){
    alert("Import failed: " + err.message);
  } finally {
    els.importSeedBtn.disabled = false;
    els.importSeedBtn.textContent = "Import Starter Data (run once)";
  }
}

// ---------- Auth ----------
auth.onAuthStateChanged(user=>{
  isAdmin = !!user;
  els.authStatus.textContent = isAdmin ? `Logged in as ${user.email}` : "Viewing only";
  els.loginToggleBtn.style.display = isAdmin ? 'none' : 'inline-block';
  els.logoutBtn.style.display = isAdmin ? 'inline-block' : 'none';
  els.adminControls.style.display = isAdmin ? 'flex' : 'none';
  els.loginPanel.classList.remove('open');
  render();
});

els.loginToggleBtn.addEventListener('click', ()=>{ els.loginPanel.classList.add('open'); });
els.loginCancelBtn.addEventListener('click', ()=>{ els.loginPanel.classList.remove('open'); });
els.loginSubmitBtn.addEventListener('click', async ()=>{
  els.loginStatus.textContent = "Logging in…";
  try{
    await auth.signInWithEmailAndPassword(els.loginEmail.value.trim(), els.loginPassword.value);
    els.loginStatus.textContent = "";
    els.loginEmail.value = ""; els.loginPassword.value = "";
  } catch(err){
    els.loginStatus.textContent = "Login failed: " + err.message;
  }
});
els.logoutBtn.addEventListener('click', ()=>{ auth.signOut(); });

// ---------- Live data ----------
placesCol.onSnapshot(snapshot=>{
  PLACES = snapshot.docs.map(doc=>({ id: doc.id, ...doc.data() }));
  populateFilterOptions();
  buildFormTimingChips();
  wireLocationSelects();
  render();
}, err=>{
  els.results.innerHTML = `<div class="empty">Could not load data: ${escapeHtml(err.message)}</div>`;
});

// ---------- Wiring ----------
els.toggleAddBtn.addEventListener('click', openAddForm);
els.f_diet.addEventListener('change', syncDietFieldsVisibility);
els.cancelAddBtn.addEventListener('click', closeAddForm);
els.saveAddBtn.addEventListener('click', saveForm);
els.importSeedBtn.addEventListener('click', importSeedData);

els.search.addEventListener('input', render);
els.searchClearBtn.addEventListener('click', ()=>{ els.search.value=""; els.search.focus(); render(); });
els.stateFilter.addEventListener('change', ()=>{ populateDistrictOptions(); render(); });
els.districtFilter.addEventListener('change', ()=>{ populateAreaOptions(); render(); });
els.areaFilter.addEventListener('change', ()=>{ populateLocationOptions(); render(); });
els.locationFilter.addEventListener('change', render);
els.distanceFilter.addEventListener('change', render);
els.clearTimingBtn.addEventListener('click', ()=>{ activeTimings.clear(); populateTimingFilterChips(); render(); });
els.timingsToggleBtn.addEventListener('click', ()=>{
  const isOpen = els.timingsPanel.style.display !== 'none';
  els.timingsPanel.style.display = isOpen ? 'none' : 'block';
  populateTimingFilterChips();
});

buildFormTimingChips();
wireLocationSelects();
</script>
</body>
